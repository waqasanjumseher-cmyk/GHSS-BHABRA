.sp-msg{position:relative;height:20px;width:100%;font-size:14px}
.sp-msg span{position:absolute;left:0;right:0;opacity:0;animation:spMsg 9s infinite}
.sp-msg span:nth-child(2){animation-delay:3s}.sp-msg span:nth-child(3){animation-delay:6s}
.sp-late{visibility:hidden;opacity:0;margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:12px;animation:spLate .6s 9s forwards}
.sp-late.now{animation-delay:0s}
.sp-e{margin:0;font-size:13px;opacity:.9}
.sp-late button{background:#fff;color:#0f766e;border:0;border-radius:12px;padding:11px 26px;font-size:15px;font-weight:700}
.sp-late a{color:#fff;opacity:.8;font-size:13px}
@keyframes spPulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@keyframes spSlide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@keyframes spMsg{0%{opacity:0;transform:translateY(6px)}6%,30%{opacity:1;transform:none}36%,100%{opacity:0}}
@keyframes spLate{to{visibility:visible;opacity:1}}
.uh{flex-wrap:wrap}.un{min-width:0;flex:1 1 150px;overflow-wrap:anywhere}.ua{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 2px 52px}

function imgPng(f,max,ink){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej('Could not read the file');r.onload=()=>{const im=new Image();im.onerror=()=>rej('Not a valid image');im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);if(ink){const d=g.getImageData(0,0,c.width,c.height),a=d.data;for(let i=0;i<a.length;i+=4){const l=(a[i]+a[i+1]+a[i+2])/3;if(a[i+3]<8||l>225)a[i+3]=0;else if(l>120)a[i+3]=Math.min(a[i+3],Math.round((225-l)*255/105))}g.putImageData(d,0,0)}res(c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(f)})}
